# Single-domain ingress. TLS/mTLS can be terminated here or by the cloud LB.
upstream sched_api      { server 127.0.0.1:8080; }
upstream sched_worker   { server 127.0.0.1:8081; }

server {
    listen 443 ssl http2;
    server_name sched.example.com;

    ssl_certificate     /etc/sched/tls/fullchain.pem;
    ssl_certificate_key /etc/sched/tls/privkey.pem;

    client_max_body_size 64m;

    location = / {
        return 302 /ui/;
    }

    location /v1/ {
        proxy_pass http://sched_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE log stream must not be buffered.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /healthz {
        proxy_pass http://sched_api;
    }

    # Embedded React console and its history fallback.
    location = /ui {
        return 301 /ui/;
    }

    location /ui/ {
        proxy_pass http://sched_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /worker/v1/ {
        proxy_pass http://sched_worker;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name sched.example.com;
    return 301 https://$host$request_uri;
}
